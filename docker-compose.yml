# Local/self-hosted stack. Secrets come from .env (copy .env.example); required ones fail fast with ${VAR:?}.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# the app process needs no Linux capabilities (it listens on 8080 as the unprivileged node user)
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-database-url: &database-url mysql://${MYSQL_USER:?set MYSQL_USER in .env}:${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}@mysql:3306/${MYSQL_DATABASE:?set MYSQL_DATABASE in .env}

x-worker-env: &worker-env
  NODE_ENV: production
  RUN_MIGRATIONS: "false"
  DATABASE_URL: *database-url
  REDIS_URL: redis://redis:6379

# workers reuse the image built by `app` instead of building it six more times
x-worker: &worker
  <<: [*logging, *hardening]
  image: laptopshop-api:local
  env_file: .env
  depends_on:
    app:
      condition: service_healthy
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  healthcheck:
    disable: true

services:
  app:
    <<: [*logging, *hardening]
    image: laptopshop-api:local
    build:
      context: .
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_URL: *database-url
      REDIS_URL: redis://redis:6379
      AFTER_SALES_IMAGES_ENABLED: ${AFTER_SALES_IMAGES_ENABLED:-true}
      AFTER_SALES_IMAGE_S3_ENDPOINT: ${AFTER_SALES_IMAGE_S3_ENDPOINT:-http://rustfs:9000}
      AFTER_SALES_IMAGE_S3_REGION: ${AFTER_SALES_IMAGE_S3_REGION:-us-east-1}
      AFTER_SALES_IMAGE_S3_BUCKET: ${AFTER_SALES_IMAGE_S3_BUCKET:-laptopshop-after-sales-images}
      AFTER_SALES_IMAGE_S3_ACCESS_KEY_ID: ${AFTER_SALES_IMAGE_S3_ACCESS_KEY_ID:-${RUSTFS_ACCESS_KEY}}
      AFTER_SALES_IMAGE_S3_SECRET_ACCESS_KEY: ${AFTER_SALES_IMAGE_S3_SECRET_ACCESS_KEY:-${RUSTFS_SECRET_KEY}}
      AFTER_SALES_IMAGE_S3_FORCE_PATH_STYLE: ${AFTER_SALES_IMAGE_S3_FORCE_PATH_STYLE:-true}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
      # a named volume is seeded from the image on first run, so the bundled product images are kept
      - uploads:/app/public/images

  payment-worker:
    <<: *worker
    environment:
      <<: *worker-env
    command: ["node", "dist/workers/payment-worker.js"]

  price-alert-worker:
    <<: *worker
    environment:
      <<: *worker-env
      PRICE_ALERT_ITEM_BATCH_SIZE: ${PRICE_ALERT_ITEM_BATCH_SIZE:-500}
    command: ["node", "dist/workers/price-alert-worker.js"]

  after-sales-worker:
    <<: *worker
    environment:
      <<: *worker-env
      AFTER_SALES_WORKER_ENABLED: "true"
    command: ["node", "dist/workers/after-sales-worker.js"]

  outbox-dispatcher:
    <<: *worker
    environment:
      <<: *worker-env
      NOTIFICATION_OUTBOX_ENABLED: "true"
    command: ["node", "dist/workers/outbox-dispatcher.js"]

  notification-worker:
    <<: *worker
    environment:
      <<: *worker-env
      NOTIFICATION_WORKER_ENABLED: "true"
    command: ["node", "dist/workers/notification-worker.js"]

  notification-maintenance-worker:
    <<: *worker
    environment:
      <<: *worker-env
      NOTIFICATION_WORKER_ENABLED: "true"
    command: ["node", "dist/workers/notification-maintenance-worker.js"]

  mysql:
    <<: *logging
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    <<: *logging
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mailpit:
    <<: *logging
    image: axllent/mailpit:v1.27.4
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  rustfs:
    <<: *logging
    image: rustfs/rustfs:1.0.5
    command: ["/data"]
    environment:
      RUSTFS_VOLUMES: /data/rustfs{0..3}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY in .env}
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfs-data-0:/data/rustfs0
      - rustfs-data-1:/data/rustfs1
      - rustfs-data-2:/data/rustfs2
      - rustfs-data-3:/data/rustfs3
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  rustfs-init:
    <<: *logging
    image: amazon/aws-cli:2.40.3
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      STORAGE_ENDPOINT: http://rustfs:9000
      STORAGE_BUCKET: laptopshop-review-images
      STORAGE_BUCKETS: laptopshop-review-images,laptopshop-after-sales-images
    entrypoint: ["/bin/sh", "/init/rustfs-init.sh"]
    volumes:
      - ./docker/rustfs-init.sh:/init/rustfs-init.sh:ro
    restart: "no"

  # throwaway database for `prisma migrate dev` (see AGENTS.md); never holds real data
  mysql-test:
    image: mysql:8.4
    profiles: ["test"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_TEST_ROOT_PASSWORD:-test}
      MYSQL_DATABASE: laptopshop_test
    ports:
      - "127.0.0.1:3307:3306"
    tmpfs:
      - /var/lib/mysql

volumes:
  mysql-data:
  redis-data:
  uploads:
  rustfs-data-0:
  rustfs-data-1:
  rustfs-data-2:
  rustfs-data-3:
