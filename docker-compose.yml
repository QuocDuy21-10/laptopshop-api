services:
  app:
    build:
      context: .
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      REDIS_URL: redis://redis:6379
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      # a named volume is seeded from the image on first run, so the bundled product images are kept
      - uploads:/app/public/images

  payment-worker:
    build:
      context: .
    env_file: .env
    environment:
      NODE_ENV: production
      RUN_MIGRATIONS: "false"
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      REDIS_URL: redis://redis:6379
    depends_on:
      app:
        condition: service_healthy
      mysql:
        condition: service_healthy
    restart: unless-stopped
    command: ["node", "dist/workers/payment-worker.js"]
    healthcheck:
      disable: true

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  minio-init:
    image: amazon/aws-cli:latest
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      until aws --endpoint-url http://minio:9000 s3api list-buckets >/dev/null 2>&1; do sleep 1; done;
      aws --endpoint-url http://minio:9000 s3api head-bucket --bucket laptopshop-review-images ||
      aws --endpoint-url http://minio:9000 s3api create-bucket --bucket laptopshop-review-images
    restart: "no"

  mysql-test:
    image: mysql:8.4
    profiles: ["test"]
    environment:
      MYSQL_ROOT_PASSWORD: test
      MYSQL_DATABASE: laptopshop_test
    ports:
      - "3307:3306"
    tmpfs:
      - /var/lib/mysql

  minio-test:
    image: minio/minio:latest
    profiles: ["test"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio-test
      MINIO_ROOT_PASSWORD: minio-test-secret
    ports:
      - "9002:9000"
      - "9003:9001"
    tmpfs:
      - /data

  minio-test-init:
    image: amazon/aws-cli:latest
    profiles: ["test"]
    depends_on:
      minio-test:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: minio-test
      AWS_SECRET_ACCESS_KEY: minio-test-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      until aws --endpoint-url http://minio-test:9000 s3api list-buckets >/dev/null 2>&1; do sleep 1; done;
      aws --endpoint-url http://minio-test:9000 s3api head-bucket --bucket laptopshop-review-images-test ||
      aws --endpoint-url http://minio-test:9000 s3api create-bucket --bucket laptopshop-review-images-test
    restart: "no"

volumes:
  mysql-data:
  redis-data:
  uploads:
  minio-data:
